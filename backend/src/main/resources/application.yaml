spring:
  application:
    name: portal

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:insurance_portal}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}

  flyway:
    enabled: true
    baseline-on-migrate: false
    out-of-order: true
    locations: classpath:db/migration/{vendor}

  jpa:
    open-in-view: false

security:
  jwt:
    secret: ${JWT_SECRET:8VdE7hL1pQzY2nR6tU0wX4aB9cD3fG5kM1sT7vN2yH8jK6mP}
    expiration-ms: 3600000

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  product:
    seed:
      enabled: ${APP_PRODUCT_SEED_ENABLED:false}
  validation-data:
    enabled: ${APP_VALIDATION_DATA_ENABLED:false}
    customer:
      username: ${VALIDATION_CUSTOMER_USERNAME:}
      password: ${VALIDATION_CUSTOMER_PASSWORD:}
    agent:
      username: ${VALIDATION_AGENT_USERNAME:}
      password: ${VALIDATION_AGENT_PASSWORD:}
    claims-officer:
      username: ${VALIDATION_CLAIMS_OFFICER_USERNAME:}
      password: ${VALIDATION_CLAIMS_OFFICER_PASSWORD:}
    admin:
      username: ${VALIDATION_ADMIN_USERNAME:}
      password: ${VALIDATION_ADMIN_PASSWORD:}

logging:
  file:
    path: ${LOG_PATH:logs}
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
